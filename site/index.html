<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#231a12;--muted:#5e4d3e;--line:#e6d9c6;--acc:#c2410c;--acc-d:#9a330a;--acc2:#fff0e3;--ok:#166534;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fef2f2}

.lista-botoes{padding:4px 0}

.linha.ing{flex-direction:column;align-items:stretch;padding:0;gap:0}

.linhabtn .seta{font-size:20px}

.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f1e8da}
.lista li small{display:block;color:var(--muted);font-size:15px;font-weight:400}
.lista li b{text-align:right;white-space:nowrap}
.lista li.tot{border-top:2px solid var(--line);border-bottom:0;font-weight:700;font-size:19px}
.bloco{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.bloco.destaque{border:2px solid #fdba74;background:#fffaf4}
.bloco .linha{padding:6px 2px 10px;min-height:0}
.tamcusto{border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.parte{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fffdf9}
.ingr{border-bottom:1px solid var(--line);padding:8px 0 10px}

.qrow .in{max-width:120px}
.qrow .un{color:var(--muted);font-size:16px}
.qrow .custo{margin-left:auto;font-weight:700;font-size:16px}
.parterod{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fixo{display:grid;grid-template-columns:1fr 130px 52px;gap:8px;margin-bottom:8px}
.encrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.encrow small{display:block;color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .in{width:92px;text-align:center}
.bloco .stepper{margin-bottom:12px}.bloco .stepper .in{width:auto;flex:1}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
nav.bottom button{flex:1;max-width:150px;background:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer;min-height:60px}
nav.bottom .ic{font-size:26px;line-height:1}
nav.bottom button.on{background:var(--acc2);color:var(--acc-d)}
.modal{position:fixed;inset:0;background:rgba(20,12,4,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:calc(100vh - 32px);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.mtit{flex:1;min-width:0}
.msub{display:inline-block;background:var(--acc2);color:var(--acc-d);font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:4px}
.xbtn{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:22px;cursor:pointer;color:var(--ink)}
.mbody{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.mfoot .btn{flex:1}
.mfoot.col{flex-direction:column}
@media(max-width:700px){.modal{padding:0;align-items:stretch}.sheet{max-height:none;height:100%;border-radius:0}}
@media(max-width:420px){.tres{grid-template-columns:1fr 1fr}.tres>div:nth-child(2){grid-column:1/-1;order:-1}.nome{font-size:21px}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{max-width:420px;width:100%}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:14px;font-size:17px;z-index:30;max-width:92vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.alerta{font-size:14px;color:var(--bad);font-weight:700;white-space:nowrap}
.linha small b.pr{display:inline;font-size:15px;color:var(--acc-d)}
.tamcard{padding:14px}
.arq .linha{gap:12px}
.arq .btn{flex:none}
</style>

<body>
<div id="root"></div>
<script>
(function(){
'use strict';
/* ================= Configuração ================= */
var SB_URL='https://ggsluymzpecvuxuydrev.supabase.co',SB_KEY='sb_publishable_a4QlBTy5a8E5pmaCJC-WUw_OI6bYTQf';
var K_COD='delipastel-codigo',K_CACHE='delipastel-cache',K_DRAFT='delipastel-rascunho';
var local={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ================= Estado ================= */
var S=null,rev=null,atualizadoEm=null;
var dirty=false,saving=false,offline=false,editSeq=0,saveTimer=null,loginMsg='';
var tab='precos';
var M=null; // janela aberta: {tipo:'receita'|'ficha'|'preco'|'ingrediente'|'usos'|'compras'|'confirmar'|'conflito'|'backup', ...}
var busca='';
var TABS=[['precos','💰','Preços'],['receitas','📖','Receitas'],['ingredientes','🛒','Ingredientes'],['encomenda','📦','Encomenda'],['ajustes','⚙️','Ajustes']];
(function(){var h=(location.hash||'').slice(1);if(TABS.some(function(t){return t[0]===h;}))tab=h;})();
var root=document.getElementById('root');

/* ================= Formatação ================= */
function brl(v,d){if(v==null||!isFinite(v))return '—';d=d==null?2:d;return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:d});}
function nf(v,d){if(v==null||!isFinite(v))return '';return v.toLocaleString('pt-BR',{maximumFractionDigits:d==null?2:d,useGrouping:false});}
function pct(v){return isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%':'—';}
function parseNum(s){s=String(s).trim().replace(/\s|R\$|%|kg$|g$|ml$/gi,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?n:0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function catLabel(c){return c==='Frito'?'Fritos':c==='Assado'?'Assados':'Outros';}
function qtyLabel(q,b){if(b==='g')return q>=1000?nf(q/1000,2)+' kg':nf(q,q<10?1:0)+' g';if(b==='ml')return q>=1000?nf(q/1000,2)+' litros':nf(q,q<10?1:0)+' ml';var n=Math.round(q*10)/10;return nf(n,1)+(n===1?' unidade':' unidades');}
function unidNome(u){return {kg:'kg',g:'gramas',L:'litros',ml:'ml',un:'unidades'}[u]||u;}

/* ================= Cálculos ================= */
function fator(u){return (u==='kg'||u==='L')?1000:1;}
function base(u){return (u==='kg'||u==='g')?'g':(u==='L'||u==='ml')?'ml':'un';}
function insById(id){for(var i=0;i<S.insumos.length;i++)if(S.insumos[i].id===id)return S.insumos[i];return null;}
function prodById(id){for(var i=0;i<S.produtos.length;i++)if(S.produtos[i].id===id)return S.produtos[i];return null;}
function tamById(p,id){for(var i=0;i<p.tamanhos.length;i++)if(p.tamanhos[i].id===id)return p.tamanhos[i];return null;}
function custoBase(ins){var q=(ins.qtd||0)*fator(ins.unid);return q>0?(ins.preco||0)/q:0;}
function precoReferencia(ins){var b=base(ins.unid),c=custoBase(ins);return b==='g'?brl(c*1000)+' o kg':b==='ml'?brl(c*1000)+' o litro':brl(c)+' a unidade';}
function compCusto(c){var t=0;c.itens.forEach(function(it){var x=insById(it.ins);if(x)t+=(it.qtd||0)*custoBase(x);});return t;}
function compPorG(c){return c.rend>0?compCusto(c)/c.rend:0;}
function peso(t){var s=0;for(var k in t.g)s+=(+t.g[k]||0);return s;}
function totalFixos(){return S.fixos.reduce(function(a,f){return a+(+f.valor||0);},0);}
function fixoPorG(){var P=S.params;return P.producaoKg>0?totalFixos()/(P.producaoKg*1000):0;}
function fixoPorUn(){var P=S.params;return P.producaoUn>0?totalFixos()/P.producaoUn:0;}
function dedPct(){var p=S.params;return ((+p.imposto||0)+(+p.taxaCartao||0)+(+p.comissao||0))/100;}
function oleoPorMl(){var o=insById('oleo');return o?custoBase(o):0;}
function calc(p,t){
  var w=peso(t),ing=0,partes=[];
  p.comps.forEach(function(c){var g=+t.g[c.id]||0,v=g*compPorG(c);ing+=v;partes.push({nome:c.nome,g:g,v:v});});
  var oleo=(w/1000)*(+p.fritura||0)*oleoPorMl();
  var perda=Math.min(+p.perda||0,95)/100;
  var ingT=(ing+oleo)/(1-perda);
  var emb=(t.emb!=null&&t.emb!=='')?+t.emb:(+S.params.embalagem||0);
  var fix=S.params.rateioModo==='un'?fixoPorUn():w*fixoPorG();
  var custo=ingT+emb+fix,ded=dedPct(),mg=(+S.params.margem||0)/100,div=1-ded-mg,sug=div>0?custo/div:NaN;
  var manual=t.preco!=null&&t.preco>0,preco=manual?+t.preco:sug,lucro=preco*(1-ded)-custo;
  return {peso:w,partes:partes,oleo:oleo,ing:ingT,emb:emb,fix:fix,custo:custo,sug:sug,preco:preco,manual:manual,lucro:lucro,margem:preco>0?lucro/preco:NaN};
}
function necessidade(p,t,q,acc){
  acc=acc||{};var perda=1-Math.min(+p.perda||0,95)/100;
  p.comps.forEach(function(c){if(!(c.rend>0))return;var f=q*(+t.g[c.id]||0)/perda/c.rend;c.itens.forEach(function(it){acc[it.ins]=(acc[it.ins]||0)+(it.qtd||0)*f;});});
  var ml=q*peso(t)/1000*(+p.fritura||0)/perda;if(ml>0)acc.oleo=(acc.oleo||0)+ml;
  return acc;
}
function ativos(){return S.produtos.filter(function(p){return !p.arquivado;});}
function arquivados(){return S.produtos.filter(function(p){return p.arquivado;});}
function grupos(){var g={};ativos().forEach(function(p){(g[p.cat]=g[p.cat]||[]).push(p);});return Object.keys(g).sort(function(a,b){return a==='Frito'?-1:b==='Frito'?1:a.localeCompare(b);}).map(function(k){return [k,g[k]];});}
function nomeTamanho(w){return w<=35?'Festa':w<100?'Média':'Grande';}
function tNome(t){return (t.nome?esc(t.nome)+' · ':'')+nf(peso(t),0)+' g';}
function usoDe(id){return S.produtos.filter(function(p){return p.comps.some(function(c){return c.itens.some(function(it){return it.ins===id;});});});}

/* ================= Banco (Supabase) e salvamento automático ================= */
function rpc(nome,body){return fetch(SB_URL+'/rest/v1/rpc/'+nome,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return null;}).then(function(j){if(!r.ok){var t=JSON.stringify(j||'');throw new Error(/codigo_invalido/.test(t)?'codigo':/conflito/.test(t)?'conflito':'rede');}return j;});});}
function aplicar(j){S=j.conteudo;rev=j.rev;atualizadoEm=j.atualizado_em;if(!S.pedido)S.pedido={};}
(function(){var c=local.get(K_CACHE);if(c){try{aplicar(JSON.parse(c));}catch(e){}}var d=local.get(K_DRAFT);if(S&&d){try{d=JSON.parse(d);if(d.rev===rev&&d.data){S=d.data;dirty=true;}}catch(e){}}})();

function touch(){dirty=true;editSeq++;local.set(K_DRAFT,JSON.stringify({rev:rev,data:S}));clearTimeout(saveTimer);saveTimer=setTimeout(save,1200);status();}
function save(forcar){
  clearTimeout(saveTimer);
  var cod=local.get(K_COD);if(!cod||!S||!dirty)return;
  if(saving){saveTimer=setTimeout(save,800);return;}
  saving=true;status();
  var seq=editSeq,envio=clone(S);
  rpc('delipastel_salvar',{codigo:cod,conteudo:envio,rev_base:forcar?null:rev}).then(function(j){
    saving=false;offline=false;rev=j.rev;atualizadoEm=j.atualizado_em;
    local.set(K_CACHE,JSON.stringify({conteudo:envio,rev:rev,atualizado_em:atualizadoEm}));
    if(seq===editSeq){dirty=false;local.del(K_DRAFT);}else{local.set(K_DRAFT,JSON.stringify({rev:rev,data:S}));saveTimer=setTimeout(save,300);}
    status();
  }).catch(function(e){
    saving=false;
    if(e.message==='conflito'){M={tipo:'conflito'};render();}
    else if(e.message==='codigo'){toast('O código não foi aceito. Entre de novo.');}
    else{offline=true;saveTimer=setTimeout(save,30000);}
    status();
  });
}
function entrar(codigo,silencioso){
  codigo=String(codigo||'').trim().toUpperCase();if(!codigo)return;
  if(!silencioso){loginMsg='Entrando…';render();}
  rpc('delipastel_ler',{codigo:codigo}).then(function(j){
    offline=false;local.set(K_COD,codigo);
    if(!j||!j.conteudo){loginMsg='Ainda não há dados guardados.';render();return;}
    if(dirty){if(j.rev!==rev){M={tipo:'conflito'};render();}else save();return;}
    if(j.rev===rev&&S){status();return;}
    aplicar(j);local.set(K_CACHE,JSON.stringify(j));loginMsg='';render();
  }).catch(function(e){
    if(e.message==='codigo'){local.del(K_COD);loginMsg='Código errado. Confira e tente de novo.';render();return;}
    offline=true;loginMsg=S?'':'Sem internet. Conecte e tente de novo.';render();
  });
}

  return janela(esc(x.nome),'Onde é usado',corpo,'<button class="btn pri" data-act="fechar">Fechar</button>');
}

/* ================= Tela: Encomenda ================= */
function vEncomenda(){
  var T={q:0,c:0,f:0,l:0},need={},h='';
  var linhas='';
  grupos().forEach(function(g){linhas+='<h2 class="grupo">'+catLabel(g[0])+'</h2>';g[1].forEach(function(p){
    linhas+='<div class="card"><div class="nome">'+esc(p.nome)+'</div>';
    p.tamanhos.forEach(function(t){var k=p.id+'|'+t.id,q=+S.pedido[k]||0,c=calc(p,t);
      T.q+=q;T.c+=q*c.custo;T.f+=q*c.preco;T.l+=q*c.lucro;if(q>0)necessidade(p,t,q,need);
      linhas+='<div class="encrow"><div><b>'+tNome(t)+'</b><small>'+brl(c.preco)+' cada'+(q?' · total '+brl(q*c.preco):'')+'</small></div><div class="stepper">'+
        '<button class="btn sq" data-act="qtd" data-k2="'+k+'" data-v="-25">−</button>'+num('pedido','data-kk="'+k+'"',q?nf(q,0):'','0')+'<button class="btn sq" data-act="qtd" data-k2="'+k+'" data-v="25">+</button></div></div>';
    });
    linhas+='</div>';
  });});
  h+='<h1>Encomenda</h1><p class="lead">Coloque quantos salgados a cliente quer. Os botões − e + mudam de 25 em 25.</p>';
  h+='<div class="resumo"><div><span class="lbl">Salgados</span><span class="val">'+T.q.toLocaleString('pt-BR')+'</span></div><div><span class="lbl">Cobrar</span><span class="val big">'+brl(T.f)+'</span></div><div><span class="lbl">Lucro</span><span class="val '+(T.l<0?'neg':'pos')+'">'+brl(T.l)+'</span></div></div>';
  if(T.q)h+='<div class="row2"><button class="btn sec" data-act="compras">🛒 Lista de compras</button><button class="btn sec" data-act="limparpedido">Limpar</button></div><p class="ajuda">Custo para fazer: '+brl(T.c)+'</p>';
  return h+linhas;
}
function mCompras(){
  var need={};ativos().forEach(function(p){p.tamanhos.forEach(function(t){var q=+S.pedido[p.id+'|'+t.id]||0;if(q>0)necessidade(p,t,q,need);});});
  var tot=0,corpo='<ul class="lista">';
  Object.keys(need).sort(function(a,b){var x=insById(a),y=insById(b);return (x?x.nome:'').localeCompare(y?y.nome:'');}).forEach(function(k){var x=insById(k);if(!x)return;var v=need[k]*custoBase(x);tot+=v;corpo+='<li><span>'+esc(x.nome)+'<small>'+qtyLabel(need[k],base(x.unid))+'</small></span><b>'+brl(v)+'</b></li>';});
  corpo+='<li class="tot"><span>Total</span><b>'+brl(tot)+'</b></li></ul>';
  return janela('Lista de compras','Para esta encomenda',corpo,'<button class="btn sec" data-act="copiarcompras">Copiar lista</button><button class="btn pri" data-act="fechar">Fechar</button>');
}

/* ================= Tela: Ajustes ================= */
function vAjustes(){
  var P=S.params,tf=totalFixos(),kg=P.rateioModo!=='un';
  var h='<h1>Ajustes</h1><p class="lead">Estes valores entram no preço de todos os salgados. Normalmente só precisam ser mudados de vez em quando.</p>';
  h+='<div class="card"><h3>Lucro e taxas</h3>'+campo('Lucro que você quer ganhar (%)',num('param','data-f="margem"',nf(P.margem)),'Ex.: 30 = de cada R$ 1,00 vendido, R$ 0,30 é lucro.')+
    campo('Imposto (%)',num('param','data-f="imposto"',nf(P.imposto)),'MEI ou Simples. Se não paga imposto sobre a venda, coloque 0.')+
    campo('Taxa da maquininha / Pix (%)',num('param','data-f="taxaCartao"',nf(P.taxaCartao)))+
    campo('Comissão de aplicativo de entrega (%)',num('param','data-f="comissao"',nf(P.comissao)),'iFood e parecidos. Se não usa, coloque 0.')+
    campo('Embalagem por salgado (R$)',num('param','data-f="embalagem"',nf(P.embalagem,3)),'Ex.: caixa de um cento a R$ 3,00 → 0,03.')+'</div>';
  h+='<div class="card"><h3>Contas fixas do mês</h3><p class="ajuda">Aluguel, luz, gás, salários… Essas contas são divididas entre todos os salgados produzidos no mês.</p>';
  S.fixos.forEach(function(f,i){h+='<div class="fixo">'+txt('fixo','data-i="'+i+'" data-f="nome"',f.nome)+num('fixo','data-i="'+i+'" data-f="valor"',nf(f.valor,2))+'<button class="btn lixo" data-act="delfixo" data-v="'+i+'" aria-label="Apagar">🗑</button></div>';});
  h+='<button class="btn sec wide" data-act="addfixo">+ Adicionar conta</button><div class="resultado bom">Total do mês: <b>'+brl(tf)+'</b></div>';
  h+=campo('Quantos kg de salgado você faz por mês',num('param','data-f="producaoKg"',nf(P.producaoKg,1)),'Some tudo o que sai da cozinha no mês, mais ou menos. Quanto mais você produz, menor o custo de cada salgado.');
  if(!kg)h+=campo('Quantos salgados por mês',num('param','data-f="producaoUn"',nf(P.producaoUn,0)));
  h+='<p class="ajuda">Cada kg produzido leva <b>'+brl(fixoPorG()*1000)+'</b> das contas fixas.</p></div>';
  var sk=0,n=0;ativos().forEach(function(p){p.tamanhos.forEach(function(t){var c=calc(p,t);if(isFinite(c.preco)&&c.peso>0){sk+=(c.preco*(1-dedPct())-c.ing-c.emb)/c.peso*1000;n++;}});});
  if(n){var mk=sk/n;h+='<div class="card"><h3>Quanto precisa vender</h3><p class="lead" style="margin:0">Para pagar as contas fixas do mês ('+brl(tf)+'), é preciso vender mais ou menos <b>'+(mk>0?Math.ceil(tf/mk).toLocaleString('pt-BR'):'—')+' kg de salgados por mês</b>. Daí para cima é lucro.</p></div>';}
  h+='<div class="card"><h3>Segurança</h3><p class="ajuda">Tudo é salvo sozinho na internet. A cópia de segurança é um texto com todos os dados, para guardar no WhatsApp ou e-mail.</p><button class="btn sec wide" data-act="backup">Cópia de segurança</button><button class="btn sec wide" data-act="sair">Sair deste aparelho</button></div>';
  return h;
}
function mBackup(){return janela('Cópia de segurança','',
  '<p class="ajuda">Toque em <b>Copiar</b> e cole numa conversa do WhatsApp consigo mesma ou num e-mail. Para recuperar, cole o texto aqui e toque em <b>Recuperar</b>.</p><textarea id="bk" class="in">'+esc(JSON.stringify(S))+'</textarea>',
  '<button class="btn sec" data-act="importbk">Recuperar</button><button class="btn pri" data-act="copybk">Copiar</button>');}
function mConfirmar(){return janela(M.titulo,'','<p class="lead">'+M.msg+'</p>','<button class="btn sec" data-act="fechar">Não, voltar</button><button class="btn danger" data-act="sim">'+M.botao+'</button>');}
function mConflito(){return '<div class="modal"><div class="sheet"><div class="mhead"><div class="mtit"><h2>Mudaram os dados em outro aparelho</h2></div></div><div class="mbody"><p class="lead">Alguém salvou mudanças em outro celular ou computador enquanto você mexia aqui. O que você quer fazer?</p></div><div class="mfoot col"><button class="btn pri" data-act="cf-manter">Manter o que eu fiz aqui</button><button class="btn sec" data-act="cf-baixar">Ver o que mudaram (perde o que eu fiz)</button></div></div></div>';}

/* ================= Login ================= */
function vLogin(){
  return '<div class="login"><div class="card"><div class="brand big">Deli<span>pastel</span></div><p class="lead">Custos e preços dos salgados.</p><form id="flogin"><label class="campo"><span class="rot">Código da fábrica</span><input id="cod" class="in grande" autocomplete="off" autocapitalize="characters" placeholder="DELI-XXXXXX" style="text-transform:uppercase;text-align:center"></label><button class="btn pri wide">Entrar</button></form><p class="ajuda" style="text-align:center">'+esc(loginMsg)+'</p></div></div>';
}

/* ================= Desenho da tela ================= */
var pressing=false,needRender=false;
function render(){
  needRender=false;
  if(!S){root.innerHTML=vLogin();var f=document.getElementById('flogin');if(f)f.addEventListener('submit',function(e){e.preventDefault();entrar(document.getElementById('cod').value);});return;}
  var ae=document.activeElement,key=ae&&ae.dataset&&ae.dataset.k,y=window.scrollY,sh=document.querySelector('.mbody'),my=sh?sh.scrollTop:0,mtipo=M&&M.tipo+(M.id||'');
  var v={precos:vPrecos,receitas:vReceitas,ingredientes:vIngredientes,encomenda:vEncomenda,ajustes:vAjustes}[tab]();
  var m='';if(M){m={nomes:mNomes,cartao:mCartao,preco:mPreco,receita:mReceita,ficha:mFicha,ingrediente:mIngrediente,usos:mUsos,compras:mCompras,backup:mBackup,confirmar:mConfirmar,conflito:mConflito}[M.tipo]();}
  root.innerHTML=cabecalho()+'<main>'+v+'</main>'+menu()+m;
  status();
  try{window.scrollTo(0,y);}catch(e){}
  sh=document.querySelector('.mbody');if(sh&&my&&render._m===mtipo)sh.scrollTop=my;render._m=mtipo;
  document.body.style.overflow=M?'hidden':'';
  if(key){var els=root.querySelectorAll('[data-k]');for(var i=0;i<els.length;i++)if(els[i].dataset.k===key){try{els[i].focus({preventScroll:true});}catch(e){}break;}}
}
function renderSoon(){if(pressing)needRender=true;else render();}
document.addEventListener('pointerdown',function(){pressing=true;},true);
document.addEventListener('pointerup',function(){pressing=false;setTimeout(function(){if(needRender)render();},60);},true);
document.addEventListener('pointercancel',function(){pressing=false;if(needRender)render();},true);
function abrir(m,comVolta){if(comVolta&&M&&M.tipo!=='confirmar')m.volta=M;M=m;render();var sh=document.querySelector('.mbody');if(sh)sh.scrollTop=0;}

/* ================= Edição de campos ================= */
root.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.t==='busca'){busca=el.value;var pos=el.selectionStart;render();var b=root.querySelector('.busca');if(b){b.focus();try{b.setSelectionRange(pos,pos);}catch(er){}}}});
root.addEventListener('change',function(e){
  var el=e.target,ds=el.dataset||{},t=ds.t;if(!t||t==='busca')return;
  var v=el.value;if(el.hasAttribute('data-num'))v=el.value.trim()===''?null:parseNum(el.value);
  var f=ds.f,p=ds.id?prodById(ds.id):null;
  if(t==='rsim'){M.q=v||0;renderSoon();return;}
  if(t==='param')S.params[f]=v==null?0:v;
  else if(t==='fixo')S.fixos[+ds.i][f]=(f==='valor'&&v==null)?0:v;
  else if(t==='ins'){var x=insById(ds.id);if(x)x[f]=(f!=='nome'&&v==null)?0:v;}
  else if(t==='prod'&&p)p[f]=(f!=='nome'&&v==null)?0:v;
  else if(t==='comp'&&p)p.comps[+ds.ci][f]=(f!=='nome'&&v==null)?0:v;
  else if(t==='item'&&p)p.comps[+ds.ci].itens[+ds.i][f]=(f==='qtd'&&v==null)?0:v;
  else if(t==='tam'&&p){var tm=tamById(p,ds.tid);if(!tm)return;
    if(f==='peso'){v=v||0;var old=peso(tm);if(old>0){for(var k in tm.g)tm.g[k]=Math.round(tm.g[k]*v/old*10)/10;}else if(p.comps[0]){tm.g={};tm.g[p.comps[0].id]=v;}}
    else tm[f]=v;}
  else if(t==='tamg'&&p){var tg=tamById(p,ds.tid);if(tg)tg.g[ds.cid]=v||0;}
  else if(t==='preco'&&p){var tp=tamById(p,ds.tid);if(tp)tp.preco=(v==null||v<=0)?null:(f==='cento'?v/100:v);}
  else if(t==='pedido')S.pedido[ds.kk]=v||0;
  touch();renderSoon();
});
root.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.dataset.t&&e.target.dataset.t!=='busca')e.target.blur();
  if(e.key==='Escape'&&M&&M.tipo!=='conflito'){M=null;render();}
});

/* ================= Toques em botões ================= */
root.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v,id=b.dataset.id,p=id?prodById(id):null;
  if(a==='fechar'&&b.classList.contains('modal')&&e.target.closest('[data-stop]'))return;
  if(a==='tab'){tab=v;M=null;try{history.replaceState(null,'','#'+v);}catch(er){}render();try{window.scrollTo(0,0);}catch(er){}return;}
  if(a==='fechar'){M=M?(M.cancelar||M.volta||null):null;render();return;}
  // Preços
  if(a==='cartao'){abrir({tipo:'cartao',id:v});return;}
  if(a==='nomes'){abrir({tipo:'nomes',id:v},true);var fn=root.querySelector('.sheet input');if(fn)fn.focus();return;}
  if(a==='preco'){abrir({tipo:'preco',id:id,tid:b.dataset.tid},true);return;}
  if(a==='verarq'){verArq=!verArq;render();return;}
  if(a==='desarquivar'){var pd=prodById(v);if(pd){pd.arquivado=false;touch();render();toast(pd.nome+' voltou para a lista.');}return;}
  if(a==='arquivar'){var pa2=prodById(v);M={tipo:'confirmar',titulo:'Arquivar '+esc(pa2.nome)+'?',msg:'<b>'+esc(pa2.nome)+'</b> some da lista de preços, receitas e encomendas, mas não é apagado. Para voltar a usar, toque em <b>Mostrar arquivados</b> no fim da lista.',cancelar:M,botao:'Sim, arquivar',faz:function(){pa2.arquivado=true;Object.keys(S.pedido).forEach(function(k){if(k.indexOf(pa2.id+'|')===0)delete S.pedido[k];});}};render();return;}
  if(a==='usarsug'){var tu=tamById(p,b.dataset.tid);if(tu){tu.preco=null;touch();render();}return;}
  // Receita
  if(a==='receita'){abrir({tipo:'receita',id:v},true);return;}
  if(a==='rq'){M.q=Math.max(0,(+M.q||0)+(+v));render();return;}
  if(a==='rt'){M.t=v;render();return;}
  if(a==='abrirficha'){abrir({tipo:'ficha',id:v},M&&M.tipo!=='usos'&&M.tipo!=='ficha');return;}
  if(a==='setcat'){p.cat=v;if(v==='Assado')p.fritura=0;else if(!(+p.fritura>0))p.fritura=100;touch();render();return;}
  if(a==='additem'){p.comps[+b.dataset.ci].itens.push({ins:S.insumos[0].id,qtd:0});touch();render();return;}
  if(a==='delitem'){p.comps[+b.dataset.ci].itens.splice(+b.dataset.i,1);touch();render();return;}
  if(a==='addcomp'){var nc={id:uid('c'),nome:p.comps.length?'Recheio':'Massa',rend:1000,itens:[]};p.comps.push(nc);p.tamanhos.forEach(function(t){t.g[nc.id]=0;});touch();render();return;}
  if(a==='delcomp'){var ci=+b.dataset.ci,cc=p.comps[ci];M={tipo:'confirmar',titulo:'Apagar “'+esc(cc.nome)+'”?',msg:'A parte “'+esc(cc.nome)+'” e os ingredientes dela vão sair da receita de '+esc(p.nome)+'.',botao:'Sim, apagar',volta:{tipo:'ficha',id:p.id},faz:function(){p.comps.splice(ci,1);p.tamanhos.forEach(function(t){delete t.g[cc.id];});}};render();return;}
  if(a==='addtam'){var w=+v,pr={},s0=null;p.tamanhos.forEach(function(t){if(!s0&&peso(t)>0)s0=t;});var w0=s0?peso(s0):0;p.comps.forEach(function(c){pr[c.id]=w0>0?(+s0.g[c.id]||0)/w0:1/p.comps.length;});var g={};p.comps.forEach(function(c){g[c.id]=Math.round(w*pr[c.id]*10)/10;});p.tamanhos.push({id:uid('t'),nome:nomeTamanho(w),g:g,preco:null,emb:null});touch();render();return;}
  if(a==='deltam'){if(p.tamanhos.length<=1){toast('O salgado precisa ter pelo menos um tamanho.');return;}var tid=b.dataset.tid,td=tamById(p,tid);M={tipo:'confirmar',titulo:'Excluir o tamanho '+tNome(td)+'?',msg:'O tamanho <b>'+tNome(td)+'</b> vai sair de '+esc(p.nome)+'.',botao:'Sim, excluir',volta:M,faz:function(){p.tamanhos=p.tamanhos.filter(function(t){return t.id!==tid;});}};render();return;}
  if(a==='addprod'){var np={id:uid('p'),nome:'Novo salgado',cat:'Frito',perda:5,fritura:100,comps:[{id:'massa',nome:'Massa',rend:1000,itens:[]},{id:'rech',nome:'Recheio',rend:1000,itens:[]}],tamanhos:[{id:'t1',nome:'Festa',g:{massa:12,rech:8},preco:null,emb:null}]};S.produtos.push(np);touch();abrir({tipo:'ficha',id:np.id});return;}
  if(a==='dupprod'){var cp=clone(p);cp.id=uid('p');cp.nome+=' (cópia)';cp.tamanhos.forEach(function(t){t.preco=null;});S.produtos.push(cp);touch();abrir({tipo:'ficha',id:cp.id});toast('Cópia criada. Mude o nome e a receita.');return;}
  if(a==='delprod'){M={tipo:'confirmar',titulo:'Apagar '+esc(p.nome)+'?',msg:'O salgado <b>'+esc(p.nome)+'</b> e a receita dele vão ser apagados para sempre. Se só quer tirar da lista, use <b>Arquivar</b>.',cancelar:M,botao:'Sim, excluir',faz:function(){S.produtos=S.produtos.filter(function(x){return x.id!==p.id;});Object.keys(S.pedido).forEach(function(k){if(k.indexOf(p.id+'|')===0)delete S.pedido[k];});}};render();return;}
  if(a==='sim'){var f=M.faz,volta=M.volta;f();M=volta||null;touch();render();return;}
  // Ingredientes
  if(a==='abriring'){abrir({tipo:'ingrediente',id:id});return;}
  if(a==='novoing'){var ni={id:uid('i'),nome:'Novo ingrediente',unid:'kg',qtd:1,preco:0};S.insumos.push(ni);busca='';touch();abrir({tipo:'ingrediente',id:ni.id});var fi=root.querySelector('.sheet input');if(fi){fi.focus();fi.select();}return;}
  if(a==='setunid'){var xi=insById(id);if(xi){xi.unid=v;touch();render();}return;}
  if(a==='delins'){var xd=insById(id);M={tipo:'confirmar',titulo:'Apagar '+esc(xd.nome)+'?',msg:'O ingrediente vai sair da lista.',botao:'Sim, apagar',faz:function(){S.insumos=S.insumos.filter(function(x){return x.id!==id;});}};render();return;}
  if(a==='usos'){abrir({tipo:'usos',id:id});return;}
  // Encomenda
  if(a==='qtd'){var kq=b.dataset.k2;S.pedido[kq]=Math.max(0,(+S.pedido[kq]||0)+(+v));touch();render();return;}
  if(a==='compras'){abrir({tipo:'compras'});return;}
  if(a==='copiarcompras'){var need={},L=['Lista de compras — Delipastel'];S.produtos.forEach(function(pp){pp.tamanhos.forEach(function(t){var q=+S.pedido[pp.id+'|'+t.id]||0;if(q>0)necessidade(pp,t,q,need);});});Object.keys(need).forEach(function(k){var x=insById(k);if(x)L.push('• '+x.nome+': '+qtyLabel(need[k],base(x.unid)));});copiar(L.join('\n'),'Lista copiada. Cole no WhatsApp.');return;}
  if(a==='limparpedido'){M={tipo:'confirmar',titulo:'Limpar a encomenda?',msg:'Todas as quantidades voltam para zero.',botao:'Sim, limpar',faz:function(){S.pedido={};}};render();return;}
  // Ajustes
  if(a==='addfixo'){S.fixos.push({nome:'Nova conta',valor:0});touch();render();return;}
  if(a==='delfixo'){var fx=S.fixos[+v];M={tipo:'confirmar',titulo:'Apagar “'+esc(fx.nome)+'”?',msg:'Essa conta sai das contas fixas do mês.',botao:'Sim, apagar',faz:function(){S.fixos.splice(+v,1);}};render();return;}
  if(a==='backup'){abrir({tipo:'backup'});return;}
  if(a==='copybk'){copiar(document.getElementById('bk').value,'Cópia feita. Cole no WhatsApp ou e-mail.');return;}
  if(a==='importbk'){try{var o=JSON.parse(document.getElementById('bk').value);if(o.schema!==2||!o.produtos||!o.insumos||!o.params)throw 0;delete o.rev;if(!o.pedido)o.pedido={};S=o;M=null;touch();render();toast('Dados recuperados.');}catch(er){toast('Esse texto não é uma cópia de segurança válida.');}return;}
  if(a==='sair'){M={tipo:'confirmar',titulo:'Sair deste aparelho?',msg:'Para entrar de novo vai precisar do código da fábrica.'+(dirty?' <b>Ainda há mudanças sendo salvas.</b>':''),botao:'Sim, sair',faz:sair};render();return;}
  if(a==='cf-manter'){M=null;render();save(true);return;}
  if(a==='cf-baixar'){M=null;dirty=false;local.del(K_DRAFT);rev=null;entrar(local.get(K_COD),true);return;}
});
function copiar(t,msg){try{navigator.clipboard.writeText(t).then(function(){toast(msg);},function(){toast('Não consegui copiar.');});}catch(e){toast('Não consegui copiar.');}}

/* ================= Início ================= */
document.addEventListener('visibilitychange',function(){var c=local.get(K_COD);if(!c)return;if(document.hidden){if(dirty)save();}else if(!dirty&&!saving)entrar(c,true);});
window.addEventListener('online',function(){offline=false;if(dirty)save();status();});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h;})&&h!==tab){tab=h;render();}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
render();
(function(){var c=local.get(K_COD);if(c)entrar(c,!!S);})();
})();
</script>
